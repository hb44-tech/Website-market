<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Premium Seller Dashboard - Hb Market</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f4f5f8; color: #222; } header { background: #111; color: white; text-align: center; padding: 20px; } .container { max-width: 650px; margin: 25px auto; padding: 20px; } .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 3px 12px #0001; } label { display: block; margin-top: 15px; font-weight: bold; } input, select, textarea { width: 100%; padding: 13px; margin-top: 7px; border: 1px solid #ccc; border-radius: 7px; font-size: 15px; } textarea { min-height: 100px; } button { width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 7px; background: #111; color: white; font-size: 16px; } #preview { width: 100%; max-height: 250px; object-fit: cover; margin-top: 15px; border-radius: 10px; display: none; } .note { background: #fff4d6; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; } .back { display: inline-block; margin-top: 18px; color: #111; } </style> </head> <body> <header> <h2>Hb Market</h2> <p>Premium Seller Dashboard</p> </header> <div class="container"> <div class="card"> <h3>Upload Your Product</h3> <p class="note"> Dashboard preview: product details are not yet saved online. Firebase and subscription verification will be connected later. This dashboard is for physical products, not services. </p> <form id="productForm"> <label>Seller Full Name</label> <input type="text" id="sellerName" placeholder="Enter your full name" required> <label>WhatsApp Number </label>pls include country code</label> <input type="tel" id="whatsapp" placeholder="e.g. 08012345678" required> <label>Product Name</label> <input type="text" id="productName" placeholder="Enter product name" required> <label>Product Category</label> <select id="category" required> <option value="">Choose category</option> <option>Clothing</option> <option>Accessories</option> <option>Artwork</option> <option>Food</option> <option>Electronics</option> <option>Other Products</option> </select> <label>Product Description</label> <textarea id="description" placeholder="Describe your product..." required></textarea> <label>Product Price (₦)</label> <input type="number" id="price" min="0" placeholder="Enter price" required> <label>Product Picture (Camera or Gallery)</label> <input type="file" id="photo" accept="image/*" capture="environment" > <img id="preview" alt="Product preview"> <button type="submit">Preview My Product</button> </form> <a class="back" href="index.html">← Back to Home</a> </div> </div> <script> document.getElementById("photo").addEventListener("change", function() { const file = this.files[0]; const preview = document.getElementById("preview"); if (file) { preview.src = URL.createObjectURL(file); preview.style.display = "block"; } else { preview.removeAttribute("src"); preview.style.display = "none"; } }); function escapeText(value) { return String(value).replace(/[&<>"']/g, function(character) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[character]; }); } document.getElementById("productForm").addEventListener("submit", function(event) { event.preventDefault(); const seller = document.getElementById("sellerName").value.trim(); const whatsapp = document.getElementById("whatsapp").value.trim(); const name = document.getElementById("productName").value.trim(); const category = document.getElementById("category").value; const description = document.getElementById("description").value.trim(); const price = Number(document.getElementById("price").value); const photo = document.getElementById("photo").files[0]; if (!/^[0-9+\s()-]{7,20}$/.test(whatsapp)) { alert("Please enter a valid WhatsApp number."); return; } if (!Number.isFinite(price) || price < 0) { alert("Please enter a valid product price."); return; } const previewWindow = window.open("", "_blank"); if (!previewWindow) { alert("Please allow pop-ups in TrebEdit."); return; } const imageURL = photo ? URL.createObjectURL(photo) : ""; previewWindow.document.write(` <!DOCTYPE html> <html> <head> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Product Preview</title> <style> body { font-family: Arial; background: #f3f4f6; padding: 20px; } .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; } img { width: 100%; border-radius: 10px; } .price { color: green; font-size: 23px; font-weight: bold; } .contact { display: block; text-align: center; padding: 14px; background: #168b45; color: white; text-decoration: none; border-radius: 7px; } button { width: 100%; padding: 14px; margin-top: 15px; background: #111; color: white; border: none; border-radius: 7px; } </style> </head> <body> <div class="card"> <h2>Hb Market</h2> ${imageURL ? `<img src="${imageURL}" alt="Product picture">` : ""} <h2>${escapeText(name)}</h2> <p><b>Seller:</b> ${escapeText(seller)}</p> <p><b>Category:</b> ${escapeText(category)}</p> <p>${escapeText(description)}</p> <p class="price">₦${price.toLocaleString("en-NG")}</p> <a class="contact" href="https://wa.me/${whatsapp.replace(/\D/g, "")}" target="_blank"> Contact Seller on WhatsApp </a> <button onclick="window.close()">Close Preview</button> <p>Preview only — this product is not yet published.</p> </div> </body> </html> `); previewWindow.document.close(); }); </script> </body> </html>
