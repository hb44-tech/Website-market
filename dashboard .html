
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard | Hb Market</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #e5b83e;
    font-size: 24px;
    font-weight: bold;
}

header a {
    color: white;
    text-decoration: none;
}

.container {
    padding: 35px 6%;
}

.welcome {
    margin-bottom: 30px;
}

.welcome p {
    color: #666;
    margin-top: 8px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 9px;
    box-shadow: 0 2px 10px #ddd;
}

.card h3 {
    margin-bottom: 12px;
}

.card p {
    color: #666;
    line-height: 1.6;
}

.upload-section {
    background: white;
    padding: 30px;
    margin-top: 30px;
    border-radius: 9px;
    box-shadow: 0 2px 10px #ddd;
}

.upload-section h2 {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin: 16px 0 7px;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    background: #111;
    color: white;
    border: none;
    padding: 14px 22px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #a77b12;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <div class="logo">HB MARKET.</div>
    <a href="../index.html">Visit Marketplace</a>
</header>

<div class="container">

    <section class="welcome">
        <h1>Seller Dashboard</h1>
        <p>Manage your store and products from here.</p>
    </section>

    <section class="dashboard-grid">

        <div class="card">
            <h3>My Products</h3>
            <p>Manage products listed in your store.</p>
        </div>

        <div class="card">
            <h3>My Orders</h3>
            <p>Keep track of customer orders.</p>
        </div>

        <div class="card">
            <h3>My Subscription</h3>
            <p>Manage your seller subscription.</p>
        </div>

    </section>

    <section class="upload-section">

        <h2>Upload a New Product</h2>

        <form id="productForm">

            <label for="productName">Product Name</label>
            <input type="text" id="productName"
                placeholder="Enter product name" required>

            <label for="productPrice">Product Price (₦)</label>
            <input type="number" id="productPrice"
                placeholder="Enter price" min="1" required>

            <label for="productCategory">Category</label>
            <select id="productCategory" required>
                <option value="">Choose category</option>
                <option value="Clothing">Clothing</option>
                <option value="Accessories">Accessories</option>
                <option value="Artwork">Artwork</option>
                <option value="Food">Food</option>
                <option value="Electronics">Electronics</option>
                <option value="Other Products">Other Products</option>
            </select>

            <label for="productImage">Product Picture</label>
            <input type="file" id="productImage"
                accept="image/*" required>

            <label for="productDescription">Description</label>
            <textarea id="productDescription"
                placeholder="Describe your product" required></textarea>

            <button type="submit">Upload Product</button>

        </form>

    </section>

</div>

<footer>
    Hb Market | Powered by Hb Tech
</footer>

<script>
document.getElementById("productForm").addEventListener(
    "submit",
    function(event) {
        event.preventDefault();

        alert(
            "Product upload will be connected to Firebase Storage and Firestore."
        );
    }
);
</script>

</body>
</html>
