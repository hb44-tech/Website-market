
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Login | Hb Market</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    padding: 22px 7%;
}

.logo {
    color: #e5b83e;
    font-size: 25px;
    font-weight: bold;
}

.container {
    max-width: 430px;
    background: white;
    margin: 65px auto;
    padding: 35px;
    border-radius: 10px;
    box-shadow: 0 3px 15px #ddd;
}

h1 {
    margin-bottom: 12px;
}

.description {
    color: #666;
    margin-bottom: 25px;
    line-height: 1.5;
}

label {
    display: block;
    margin: 16px 0 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    background: #111;
    color: white;
    border: none;
    border-radius: 5px;
    margin-top: 25px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #a77b12;
}

.register {
    text-align: center;
    margin-top: 22px;
}

.register a {
    color: #a77b12;
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 25px;
    color: #666;
}
</style>
</head>

<body>

<header>
    <div class="logo">HB MARKET.</div>
</header>

<div class="container">

    <h1>Seller Login</h1>

    <p class="description">
        Welcome back! Log in to manage your
        Hb Market store.
    </p>

    <form id="loginForm">

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Login to Your Account</button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register here</a>
    </div>

</div>

<footer>
    Hb Market | Powered by Hb Tech
</footer>

<script>
document.getElementById("loginForm").addEventListener(
    "submit",
    function(event) {
        event.preventDefault();

        alert(
            "Login page completed! Secure login will be connected using Firebase."
        );
    }
);
</script>

</body>
</html>
