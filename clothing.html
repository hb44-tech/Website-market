
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clothing | Hb Market</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8f8f8;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #e5b83e;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: white;
    text-decoration: none;
}

.hero {
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url("https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1400");

    background-size: cover;
    background-position: center;
    padding: 90px 20px;
    text-align: center;
    color: white;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.container {
    padding: 40px 6%;
}

.products {
    display: grid;
    grid-template-columns:
    repeat(auto-fit, minmax(190px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px #ddd;
}

.product img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.product-info {
    padding: 15px;
}

.price {
    color: #a77b12;
    font-weight: bold;
    margin: 10px 0;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
}

</style>
</head>

<body>

<header>
    <div class="logo">HB MARKET.</div>
    <a href="index.html">Home</a>
</header>

<section class="hero">
    <h1>Fashion & Clothing</h1>
    <p>Discover clothing from different sellers.</p>
</section>

<section class="container">

    <h2>Clothing Products</h2>
    <br>

    <div class="products" id="productList"></div>

    <p id="emptyMessage">
        No clothing products available yet.
    </p>

</section>

<footer>
    Hb Market | Powered by Hb Tech
</footer>

<script>

function displayProducts() {

    let products = [];

    try {
        products = JSON.parse(
            localStorage.getItem("hbMarketProducts")
        ) || [];
    } catch {
        products = [];
    }

    const list = document.getElementById("productList");

    list.innerHTML = "";

    const clothing = products.filter(
        product => product.category === "Clothing"
    );

    document.getElementById("emptyMessage").style.display =
        clothing.length ? "none" : "block";

    clothing.forEach(product => {

        const card = document.createElement("div");
        card.className = "product";

        const img = document.createElement("img");
        img.src = product.image;
        img.alt = product.name;

        const info = document.createElement("div");
        info.className = "product-info";

        const name = document.createElement("h3");
        name.textContent = product.name;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent =
            "₦" + Number(product.price).toLocaleString();

        const seller = document.createElement("p");
        seller.textContent =
            "Seller: " + (product.sellerName || "Hb Market seller");

        info.append(name, price, seller);
        card.append(img, info);
        list.appendChild(card);
    });
}

displayProducts();

</script>

</body>
</html>
