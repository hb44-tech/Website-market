<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Mega Premium Dashboard - Hb Market</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f4f5f8; color: #222; } header { background: #111; color: white; padding: 20px; text-align: center; } header h2 { margin: 0; } .container { max-width: 650px; margin: 25px auto; padding: 20px; } .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 3px 12px #0001; } label { display: block; margin-top: 15px; font-weight: bold; } input, select, textarea { width: 100%; padding: 13px; margin-top: 7px; border: 1px solid #ccc; border-radius: 7px; font-size: 15px; } textarea { min-height: 100px; } button { width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 7px; background: #111; color: white; font-size: 16px; cursor: pointer; } #preview { width: 100%; max-height: 250px; object-fit: cover; margin-top: 15px; border-radius: 10px; display: none; } .note { background: #fff4d6; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; } .back { display: inline-block; margin-top: 18px; color: #111; } </style> </head> <body> <header> <h2>Hb Market</h2> <p>Mega Premium Provider Dashboard</p> </header> <div class="container"> <div class="card"> <h3>Set Up Your Service</h3> <p class="note"> Dashboard preview: your details and service listing are not yet saved online. Firebase and subscription verification will be connected later. </p> <form id="serviceForm"> <label>Full Name</label> <input type="text" id="fullname" placeholder="Enter your full name" required> <label>WhatsApp Number</label> <input type="tel" id="whatsapp" placeholder="e.g. 08012345678" required> <label>State</label> <select id="state" required> <option value="">Select your state</option> </select> <label>LGA / City / Area</label> <input type="text" id="area" placeholder="Enter your LGA or area" required> <label>Service Category</label> <select id="category" required> <option value="">Choose a service</option> <option>Hair Plaiting</option> <option>Plumbing</option> <option>Electrical Work</option> <option>Painting</option> <option>Cleaning</option> <option>Catering</option> <option>Photography</option> <option>Fashion Design</option> <option>Repairs</option> <option>Other Services</option> </select> <label>Service Title</label> <input type="text" id="title" placeholder="What service do you offer?" required> <label>Describe Your Service</label> <textarea id="description" placeholder="Tell customers about your service..." required></textarea> <label>Price (₦)</label> <input type="number" id="price" min="0" placeholder="Enter your price" required> <label>Choose Service Picture (Camera or Gallery)</label> <input type="file" id="photo" accept="image/*" capture="environment" > <img id="preview" alt="Service picture preview"> <button type="submit">Preview My Service</button> </form> <a class="back" href="services.html">← Back to Services</a> </div> </div> <script> const states = [ "Abia","Adamawa","Akwa Ibom","Anambra","Bauchi", "Bayelsa","Benue","Borno","Cross River","Delta", "Ebonyi","Edo","Ekiti","Enugu","Gombe","Imo", "Jigawa","Kaduna","Kano","Katsina","Kebbi", "Kogi","Kwara","Lagos","Nasarawa","Niger", "Ogun","Ondo","Osun","Oyo","Plateau","Rivers", "Sokoto","Taraba","Yobe","Zamfara", "Federal Capital Territory" ]; const stateSelect = document.getElementById("state"); states.forEach(function(state) { const option = document.createElement("option"); option.value = state; option.textContent = state; stateSelect.appendChild(option); }); document.getElementById("photo").addEventListener("change", function() { const file = this.files[0]; const preview = document.getElementById("preview"); if (file) { preview.src = URL.createObjectURL(file); preview.style.display = "block"; } else { preview.removeAttribute("src"); preview.style.display = "none"; } }); function escapeText(value) { return String(value).replace(/[&<>"']/g, function(character) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[character]; }); } document.getElementById("serviceForm").addEventListener("submit", function(event) { event.preventDefault(); const name = document.getElementById("fullname").value.trim(); const whatsapp = document.getElementById("whatsapp").value.trim(); const state = document.getElementById("state").value; const area = document.getElementById("area").value.trim(); const category = document.getElementById("category").value; const title = document.getElementById("title").value.trim(); const description = document.getElementById("description").value.trim(); const price = Number(document.getElementById("price").value); const photo = document.getElementById("photo").files[0]; if (!/^[0-9+\s()-]{7,20}$/.test(whatsapp)) { alert("Please enter a valid WhatsApp number."); return; } if (!Number.isFinite(price) || price < 0) { alert("Please enter a valid price."); return; } const previewWindow = window.open("", "_blank"); if (!previewWindow) { alert("Please allow pop-ups in TrebEdit to see your preview."); return; } const imageURL = photo ? URL.createObjectURL(photo) : ""; previewWindow.document.write(` <!DOCTYPE html> <html> <head> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Service Advertisement Preview</title> <style> body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; } .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; } img { width: 100%; border-radius: 10px; } .price { color: green; font-size: 22px; font-weight: bold; } .contact { display: block; text-align: center; padding: 14px; background: #168b45; color: white; text-decoration: none; border-radius: 7px; margin-top: 15px; } button { width: 100%; padding: 14px; background: #111; color: white; border: 0; border-radius: 7px; margin-top: 15px; } </style> </head> <body> <div class="card"> <h2>Hb Market</h2> ${imageURL ? `<img src="${imageURL}" alt="Service picture">` : ""} <h2>${escapeText(title)}</h2> <p><b>Provider:</b> ${escapeText(name)}</p> <p><b>Category:</b> ${escapeText(category)}</p> <p>${escapeText(description)}</p> <p><b>Location:</b> ${escapeText(area)}, ${escapeText(state)}</p> <p class="price">₦${price.toLocaleString("en-NG")}</p> <a class="contact" href="https://wa.me/${whatsapp.replace(/\D/g, "")}" target="_blank"> Contact on WhatsApp </a> <button onclick="window.close()">Close Preview</button> <p>Preview only — this advertisement is not yet published.</p> </div> </body> </html> `); previewWindow.document.close(); }); </script> </body> </html>
